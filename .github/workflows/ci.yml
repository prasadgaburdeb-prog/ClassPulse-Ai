name: ClassPulse AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Schema via Alembic
        run: |
          alembic upgrade head

      - name: Run Test Suite
        id: run_tests
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-minimum-32-characters-for-sha256-compliance"
          ENVIRONMENT: "testing"
        run: |
          pytest -v --tb=short 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish Test Output to Summary
        if: always()
        run: |
          echo "## Pytest Output (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.txt | tail -n 80 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          lines = open('pytest_output.txt', errors='ignore').readlines()
          for line in [l.strip() for l in lines if any(k in l for k in ['FAILED ', 'ERROR ', 'Error: ', 'AssertionError'])][:15]:
              print(f'::error title=Pytest Failure::{line}')
          " || true
